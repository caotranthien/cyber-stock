name: Autonomous Trading Bot Trigger

on:
  schedule:
    # Runs every 15 minutes Monday through Friday during VN market hours (02:00 to 08:00 UTC = 09:00 to 15:00 ICT)
    - cron: '*/15 2-8 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Deployed Trading Bot
        env:
          BOT_URL: ${{ secrets.BOT_DEPLOY_URL }}
        run: |
          if [ -n "$BOT_URL" ]; then
            echo "Pinging deployed bot: $BOT_URL/api/bot/scan-now"
            curl -s -X POST "$BOT_URL/api/bot/scan-now" || echo "Ping failed or service booting"
          else
            echo "BOT_DEPLOY_URL secret not set. Skipping ping."
          fi
